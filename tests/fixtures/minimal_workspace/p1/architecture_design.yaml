        patterns: [PAT-001]
        boundary_notes: [BN-001]
        risks: []
        decision_backlog: []
        recommendations:
          confirmed_by_requirement: []
          recommended_not_confirmed: []
          assumption_for_review: []
          question_only: []
      ddd_scope:
        contexts: [CTX-002]
        aggregates: [AGG-002]
        owned_objects:
          - NotificationTask
        referenced_objects:
