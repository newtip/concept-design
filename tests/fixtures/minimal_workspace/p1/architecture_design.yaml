      domain_name: Training Plan
      domain_type: core
      domain_prefix: tp
      sequence: 1
      is_anchor: true
      depends_on: []
      responsibility: Own training plan drafting and submission.
      out_of_scope:
        - Training delivery
      sub_domains:
        - module_id: MOD-tp-01
          module_name: Training Plan Drafting
      requirement_scope:
        business_goals: [GOAL-001]
        actors: [ACTOR-001]
        functions: [FUNC-001]
        workflows: [WF-001]
        commands: [CMD-001]
        policies: [POL-001]
        business_rules: [RULE-001]
        permissions: [PERM-001]
        integrations: []
        open_questions: []
        events:
          produced: [EVT-001]
          consumed: []
          related: []
      industry_scope:
        patterns: [PAT-001]
        boundary_notes: [BN-001]
        risks: [RISK-001]
        decision_backlog: [DEC-001]
        recommendations:
          confirmed_by_requirement: [REC-001]
          recommended_not_confirmed: []
          assumption_for_review: []
          question_only: []
      ddd_scope:
        contexts: [CTX-001]
        aggregates: [AGG-001]
        owned_objects:
          - TrainingPlan
        referenced_objects: []
    - domain_id: DM-002
      domain_name: Notification Support
      domain_type: supporting
      domain_prefix: ns
      sequence: 2
      is_anchor: false
      depends_on: [DM-001]
      responsibility: Send stakeholder notifications for submitted plans.
      out_of_scope:
        - Training plan lifecycle ownership
      sub_domains:
